openapi: 3.0.0
info:
  title: Sample API
  description: API description
  version: 1.0.0
servers:
  - url: http://api.example.com/v1
    description: Production server
  - url: http://localhost:3000
    description: Development server

paths:
  /user:
    post:
      tags:
        - User
      summary: Create a new user
      description: Create a new user with the provided data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /user/authenticate:
    post:
      tags:
        - User
      summary: Log in with credentials
      description: Checks to ensure proper credentials and gives JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"

      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      description: Returns a single user
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Users
      summary: Update a user
      description: Update an existing user
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Users
      summary: Delete a user
      description: Delete an existing user
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: User deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    User:
      type: object
      properties:
        first_name:
          type: string
          minLength: 3
          maxLength: 64
          example: John
        email:
          type: string
          format: email
          example: john@example.com
    UserInput:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          minLength: 3
          maxLength: 64
          example: John
        last_name:
          type: string
          minLength: 3
          maxLength: 64
          example: Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
    UserAuth:
      type: object
      required:
        - jwt
        - first_name
      properties:
        first_name:
          type: string
          minLength: 3
          maxLength: 64
          example: John
        jwt:
          type: string

  parameters:
    idParam:
      name: id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
        format: int64
    limitParam:
      name: limit
      in: query
      description: Number of items to return
      required: false
      schema:
        type: integer
        default: 10
    offsetParam:
      name: offset
      in: query
      description: Number of items to skip
      required: false
      schema:
        type: integer
        default: 0

  responses:
    BadRequest:
      description: Invalid request body
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
    NotFound:
      description: The requested resource was not found
    ServerError:
      description: Internal server error
