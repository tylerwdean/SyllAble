services:
  react-app:
    build:
      context: ./client #uses client/Dockerfile
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  express-server:
    build:
      context: ./server #uses server/Dockerfile
    volumes:
      - ./server:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data # Anonymouse volume (gets recreated)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Schema init
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d syllable"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
    postgres_data:
