services:
  react-app:
    build:
      context: ./client #uses client/Dockerfile
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  express-server:
    build:
      context: ./server #uses server/Dockerfile
    volumes:
      - ./server:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data # Anonymouse volume (gets recreated)
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  atlas:
    image: arigaio/atlas:latest
    container_name: atlas
    env_file:
      - .env
    volumes:
      - ./database/migrations:/migrations
    command: migrate apply --url "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable" --dir "file://migrations"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
